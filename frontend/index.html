<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0f;
      --surface: #1a1a1d;
      --border: #2e2e33;
      --accent: #c8f135;
      --accent-dim: #9ab82a;
      --text: #f0f0ee;
      --muted: #6b6b72;
      --done: #3a3a3e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }

    header {
      width: 100%;
      max-width: 580px;
      margin-bottom: 48px;
    }

    .label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    h1 span {
      color: var(--accent);
    }

    .add-form {
      width: 100%;
      max-width: 580px;
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
    }

    .add-form input {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-form input:focus {
      border-color: var(--accent);
    }

    .add-form input::placeholder { color: var(--muted); }

    .add-form button {
      background: var(--accent);
      color: #0e0e0f;
      border: none;
      border-radius: 10px;
      padding: 14px 22px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .add-form button:hover { background: var(--accent-dim); }
    .add-form button:active { transform: scale(0.97); }

    .stats {
      width: 100%;
      max-width: 580px;
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .stat {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .stat strong {
      color: var(--accent);
      font-size: 14px;
    }

    .todo-list {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.2s, opacity 0.2s;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item.done {
      opacity: 0.5;
      border-color: var(--done);
    }

    .todo-item.done .todo-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .check-btn {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .todo-item.done .check-btn {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check-btn svg { display: none; }
    .todo-item.done .check-btn svg { display: block; }

    .todo-title {
      flex: 1;
      font-size: 15px;
      line-height: 1.4;
    }

    .todo-time {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .del-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .del-btn:hover { color: #ff6b6b; }

    .empty {
      text-align: center;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      padding: 40px;
    }

    .error-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #ff6b6b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>

<header>
  <p class="label">// task manager</p>
  <h1>My <span>Todos</span></h1>
</header>

<div class="add-form">
  <input id="input" type="text" placeholder="Добави нова задача..." maxlength="200"/>
  <button onclick="addTodo()">+ Добави</button>
</div>

<div class="stats">
  <div class="stat">Общо: <strong id="total">0</strong></div>
  <div class="stat">Завършени: <strong id="done-count">0</strong></div>
</div>

<div class="todo-list" id="list"></div>
<div class="empty" id="empty" style="display:none">Няма задачи. Добави първата!</div>

<div class="error-toast" id="toast">Грешка при свързване с API</div>

<script>
  const API = "/api";

  async function loadTodos() {
    try {
      const res = await fetch(`${API}/todos`);
      const todos = await res.json();
      render(todos);
    } catch {
      showToast();
    }
  }

  function render(todos) {
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    document.getElementById("total").textContent = todos.length;
    document.getElementById("done-count").textContent = todos.filter(t => t.done).length;

    if (todos.length === 0) {
      list.innerHTML = "";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    list.innerHTML = todos.map(t => `
      <div class="todo-item ${t.done ? 'done' : ''}" id="todo-${t.id}">
        <button class="check-btn" onclick="toggle(${t.id})">
          <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
            <path d="M1 5l3.5 3.5L11 1" stroke="#0e0e0f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="todo-title">${escHtml(t.title)}</span>
        <span class="todo-time">${formatTime(t.created_at)}</span>
        <button class="del-btn" onclick="deleteTodo(${t.id})">×</button>
      </div>
    `).join("");
  }

  async function addTodo() {
    const input = document.getElementById("input");
    const title = input.value.trim();
    if (!title) return;
    input.value = "";
    try {
      await fetch(`${API}/todos`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title })
      });
      loadTodos();
    } catch { showToast(); }
  }

  async function toggle(id) {
    try {
      await fetch(`${API}/todos/${id}`, { method: "PATCH" });
      loadTodos();
    } catch { showToast(); }
  }

  async function deleteTodo(id) {
    try {
      await fetch(`${API}/todos/${id}`, { method: "DELETE" });
      loadTodos();
    } catch { showToast(); }
  }

  document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter") addTodo();
  });

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function formatTime(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleDateString("bg-BG", { day:"2-digit", month:"short" });
  }

  function showToast() {
    const t = document.getElementById("toast");
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 3000);
  }

  loadTodos();
</script>
</body>
</html>
